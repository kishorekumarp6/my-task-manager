<!--
  LOGIN COMPONENT TEMPLATE (Phase 2.2 - Functional JWT Authentication)
  
  Implements login form with validation and JWT authentication.
-->

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Task Manager</h2>
      <p class="subtitle">Sign in to continue</p>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" *ngIf="errorMessage">
      <span class="error-icon">⚠</span>
      <span class="error-text">{{ errorMessage }}</span>
      <button class="error-close" (click)="dismissError()" aria-label="Close">×</button>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-input"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          placeholder="demo@example.com"
          [disabled]="isLoading"
        />
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-input"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          placeholder="Enter your password"
          [disabled]="isLoading"
        />
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <div class="login-actions">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isLoading || loginForm.invalid"
        >
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="spinner"></span>
          <span *ngIf="isLoading">Signing in...</span>
        </button>
        
        <button
          type="button"
          class="btn btn-secondary"
          (click)="skipLogin()"
          [disabled]="isLoading"
        >
          Skip to Tasks
        </button>
      </div>
    </form>

    <!-- Test Credentials Info -->
    <div class="login-info">
      <div class="info-box">
        <div class="info-header" (click)="toggleCredentials()">
          <span class="toggle-arrow" [class.expanded]="isCredentialsExpanded">▶</span>
          <span class="info-icon">ℹ️</span>
          <p class="info-title"><strong>Test Credentials</strong></p>
        </div>
        <div class="info-content" *ngIf="isCredentialsExpanded">
          <ul>
            <li>Email: <code>demo@example.com</code> / Password: <code>password123</code></li>
            <li>Email: <code>admin@example.com</code> / Password: <code>admin123</code></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 2rem;
  }

  .login-card {
    background: white;
    border-radius: 12px;
    padding: 3rem;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    max-width: 500px;
    width: 100%;
  }

  .login-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .login-header h2 {
    color: #1f2937;
    font-size: 2rem;
    margin-bottom: 0.5rem;
  }

  .subtitle {
    color: #6b7280;
    font-size: 1rem;
    margin: 0;
  }

  /* Error Banner */
  .error-banner {
    background: #fef2f2;
    color: #991b1b;
    padding: 1rem;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    border: 1px solid #fecaca;
    animation: slideIn 0.3s ease-out;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .error-icon {
    font-size: 1.25rem;
    flex-shrink: 0;
  }

  .error-text {
    flex: 1;
  }

  .error-close {
    background: none;
    border: none;
    color: #991b1b;
    cursor: pointer;
    font-size: 1.5rem;
    padding: 0;
    width: 1.5rem;
    height: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }

  .error-close:hover {
    background: #fee2e2;
  }

  /* Form Styles */
  .login-form {
    margin-bottom: 2rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: #374151;
    font-weight: 500;
    font-size: 0.875rem;
  }

  .form-input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 1rem;
    transition: all 0.2s;
    box-sizing: border-box;
  }

  .form-input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
  }

  .form-input.invalid {
    border-color: #dc2626;
  }

  .form-input:disabled {
    background: #f9fafb;
    cursor: not-allowed;
  }

  .error-message {
    color: #dc2626;
    font-size: 0.875rem;
    margin-top: 0.5rem;
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 0.5rem;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .login-info {
    margin-bottom: 2rem;
  }

  .info-box {
    background: #eff6ff;
    border-left: 4px solid #2563eb;
    padding: 1.5rem;
    border-radius: 8px;
  }

  .info-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    cursor: pointer;
    user-select: none;
  }

  .info-header:hover {
    opacity: 0.8;
  }

  .toggle-arrow {
    font-size: 0.875rem;
    color: #2563eb;
    transition: transform 0.3s ease;
    flex-shrink: 0;
  }

  .toggle-arrow.expanded {
    transform: rotate(90deg);
  }

  .info-icon {
    font-size: 1.5rem;
    flex-shrink: 0;
  }

  .info-title {
    margin: 0;
    color: #374151;
    line-height: 1.6;
  }

  .info-content {
    margin-top: 1rem;
    padding-left: 2.625rem;
    animation: slideDown 0.3s ease-out;
  }

  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .info-content ul {
    margin: 0 0 0 1.5rem;
    color: #374151;
  }

  .info-content li {
    margin-bottom: 0.5rem;
  }

  .info-content code {
    background: #1f2937;
    color: #f3f4f6;
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
  }

  .login-actions {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .btn {
    padding: 1rem 2rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-primary {
    background: #2563eb;
    color: white;
  }

  .btn-primary:hover {
    background: #1d4ed8;
  }

  .btn-primary:hover:not(:disabled) {
    background: #1d4ed8;
  }

  .btn-secondary {
    background: #f3f4f6;
    color: #374151;
  }

  .btn-secondary:hover:not(:disabled) {
    background: #e5e7eb;
  }
</style>
